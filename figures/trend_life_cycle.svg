<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="tlc-title">
  <title id="tlc-title">The four phases of a trend: initiation, continuation, exhaustion, reversal, each posing a different statistical problem.</title>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#10171B">

    <!-- phase bands -->
    <g>
      <rect x="70" y="52" width="120" height="198" fill="#8A979D" opacity="0.07"/>
      <rect x="190" y="52" width="200" height="198" fill="#0B6E75" opacity="0.07"/>
      <rect x="390" y="52" width="110" height="198" fill="#9A6410" opacity="0.08"/>
      <rect x="500" y="52" width="115" height="198" fill="#A63D62" opacity="0.07"/>
    </g>

    <!-- phase headings -->
    <g text-anchor="middle" font-size="15" font-weight="700" letter-spacing="0.6">
      <text x="130" y="33" fill="#6C7A81">INITIATION</text>
      <text x="290" y="33" fill="#0B6E75">CONTINUATION</text>
      <text x="445" y="33" fill="#9A6410">EXHAUSTION</text>
      <text x="557" y="33" fill="#A63D62">REVERSAL</text>
    </g>
    <g stroke-width="2.5">
      <line x1="70" y1="41" x2="188" y2="41" stroke="#8A979D"/>
      <line x1="192" y1="41" x2="388" y2="41" stroke="#0B6E75"/>
      <line x1="392" y1="41" x2="498" y2="41" stroke="#9A6410"/>
      <line x1="502" y1="41" x2="615" y2="41" stroke="#A63D62"/>
    </g>

    <!-- axes -->
    <line x1="52" y1="52" x2="52" y2="250" stroke="#10171B" stroke-width="1.6"/>
    <path d="M 52,250 L 622,250 M 615,246 L 622,250 L 615,254" fill="none" stroke="#10171B" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="24" y="46" font-size="14" font-weight="600">price</text>
    <text x="612" y="243" font-size="12.5" font-style="italic" fill="#8A979D" text-anchor="end">time</text>

    <!-- price path -->
    <path fill="none" stroke="#10171B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
          d="M 70,232 L 85,226 L 98,236 L 112,228 L 126,238 L 140,225 L 154,232 L 168,218 L 182,222 L 190,212
             L 204,206 L 218,200 L 232,190 L 246,186 L 260,176 L 274,168 L 288,162 L 302,150 L 316,146
             L 330,134 L 344,128 L 358,118 L 372,110 L 386,102 L 390,100
             L 400,92 L 410,86 L 420,94 L 432,84 L 444,90 L 456,80 L 468,88 L 480,82 L 492,92 L 500,88
             L 510,100 L 522,118 L 534,140 L 546,158 L 558,172 L 570,182 L 582,190 L 594,194 L 606,196 L 615,198"/>

    <!-- phase dividers -->
    <g stroke="#B9C4C8" stroke-width="1" stroke-dasharray="4 4">
      <line x1="190" y1="52" x2="190" y2="250"/>
      <line x1="390" y1="52" x2="390" y2="250"/>
      <line x1="500" y1="52" x2="500" y2="250"/>
    </g>

    <!-- statistical problem per phase -->
    <g text-anchor="middle" font-size="13.5" fill="#58666E">
      <text x="130" y="271">detection</text>
      <text x="130" y="286">low SNR</text>
      <text x="290" y="271">estimation</text>
      <text x="290" y="286">and sizing</text>
      <text x="445" y="271">change-point</text>
      <text x="445" y="286">detection</text>
      <text x="557" y="271">fast, convex</text>
      <text x="557" y="286">losses</text>
    </g>
  </g>
</svg>
