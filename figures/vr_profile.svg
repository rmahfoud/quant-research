<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" role="img" aria-labelledby="vr-title">
  <title id="vr-title">Schematic variance-ratio profile: short-horizon reversal, intermediate-horizon momentum, long-horizon reversal.</title>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#10171B">

    <!-- gridlines -->
    <g stroke="#DCE4E6" stroke-width="1">
      <line x1="78" y1="64.6" x2="616" y2="64.6"/>
      <line x1="78" y1="123.2" x2="616" y2="123.2"/>
      <line x1="78" y1="181.8" x2="616" y2="181.8"/>
      <line x1="78" y1="240.4" x2="616" y2="240.4"/>
    </g>

    <!-- random-walk reference -->
    <line x1="78" y1="152.5" x2="616" y2="152.5" stroke="#58666E" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="88" y="146" font-size="13.5" font-style="italic" fill="#58666E">random walk</text>

    <!-- axes -->
    <line x1="78" y1="44" x2="78" y2="255" stroke="#10171B" stroke-width="1.6"/>
    <line x1="78" y1="255" x2="616" y2="255" stroke="#10171B" stroke-width="1.6"/>
    <text x="44" y="34" font-size="15" font-weight="600">VR(q)</text>

    <!-- y ticks -->
    <g font-size="14" fill="#58666E" text-anchor="end">
      <text x="70" y="69.6">1.3</text>
      <text x="70" y="128.2">1.1</text>
      <text x="70" y="157.5" fill="#10171B" font-weight="600">1.0</text>
      <text x="70" y="186.8">0.9</text>
      <text x="70" y="245.4">0.7</text>
    </g>

    <!-- profile -->
    <path fill="none" stroke="#10171B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
          d="M 100,195.0 L 124.5,192.0 L 149,184.1 L 173.5,172.1 L 198,157.5 L 222.5,141.1 L 247,124.4
             L 271.5,108.0 L 296,93.4 L 320.5,81.3 L 345,73.4 L 369.5,70.5 L 394,75.5 L 418.5,88.7
             L 443,107.7 L 467.5,130.3 L 492,154.3 L 516.5,176.8 L 541,195.8 L 565.5,209.0 L 590,214.0"/>

    <!-- x ticks -->
    <g stroke="#10171B" stroke-width="1.4">
      <line x1="100" y1="255" x2="100" y2="260"/>
      <line x1="170" y1="255" x2="170" y2="260"/>
      <line x1="240" y1="255" x2="240" y2="260"/>
      <line x1="310" y1="255" x2="310" y2="260"/>
      <line x1="380" y1="255" x2="380" y2="260"/>
      <line x1="450" y1="255" x2="450" y2="260"/>
      <line x1="520" y1="255" x2="520" y2="260"/>
      <line x1="590" y1="255" x2="590" y2="260"/>
    </g>
    <g font-size="14" fill="#58666E" text-anchor="middle">
      <text x="100" y="276">1d</text>
      <text x="170" y="276">5d</text>
      <text x="240" y="276">1m</text>
      <text x="310" y="276">3m</text>
      <text x="380" y="276">6m</text>
      <text x="450" y="276">12m</text>
      <text x="520" y="276">24m</text>
      <text x="590" y="276">48m</text>
    </g>

    <!-- regime brackets -->
    <g fill="none" stroke-width="2">
      <path stroke="#A63D62" d="M 100,296 L 100,290 L 205,290 L 205,296"/>
      <path stroke="#0B6E75" d="M 211,296 L 211,290 L 486,290 L 486,296"/>
      <path stroke="#A63D62" d="M 492,296 L 492,290 L 592,290 L 592,296"/>
    </g>

    <g text-anchor="middle">
      <text x="152" y="312" font-size="16" font-weight="600" fill="#A63D62">reversal</text>
      <text x="152" y="328" font-size="13.5" fill="#58666E">liquidity,</text>
      <text x="152" y="342" font-size="13.5" fill="#58666E">microstructure</text>

      <text x="348" y="312" font-size="16" font-weight="600" fill="#0B6E75">momentum</text>
      <text x="348" y="328" font-size="13.5" fill="#58666E">under-reaction</text>

      <text x="542" y="312" font-size="16" font-weight="600" fill="#A63D62">reversal</text>
      <text x="542" y="328" font-size="13.5" fill="#58666E">over-reaction /</text>
      <text x="542" y="342" font-size="13.5" fill="#58666E">valuation anchor</text>
    </g>

    <text x="347" y="366" font-size="12.5" font-style="italic" fill="#8A979D" text-anchor="middle">horizon q (log scale)</text>
  </g>
</svg>
