<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img" aria-labelledby="wf-title">
  <title id="wf-title">Walk-forward validation: four successive train/test splits whose test segments tile the timeline and concatenate into one out-of-sample series.</title>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#10171B">

    <text x="52" y="20" font-size="13" font-style="italic" fill="#58666E">Fit on train, apply unchanged to test, record, advance.</text>

    <g font-size="13.5" text-anchor="middle">
      <!-- step 1 -->
      <text x="34" y="60" fill="#8A979D">1</text>
      <rect x="52" y="40" width="220" height="30" rx="3" fill="#E3E9EB" stroke="#C7D2D6"/>
      <text x="162" y="60">train</text>
      <rect x="272" y="40" width="80" height="30" rx="3" fill="#0B6E75"/>
      <text x="312" y="60" fill="#FFFFFF" font-weight="600">test</text>

      <!-- step 2 -->
      <text x="34" y="104" fill="#8A979D">2</text>
      <rect x="132" y="84" width="220" height="30" rx="3" fill="#E3E9EB" stroke="#C7D2D6"/>
      <text x="242" y="104">train</text>
      <rect x="352" y="84" width="80" height="30" rx="3" fill="#0B6E75"/>
      <text x="392" y="104" fill="#FFFFFF" font-weight="600">test</text>

      <!-- step 3 -->
      <text x="34" y="148" fill="#8A979D">3</text>
      <rect x="212" y="128" width="220" height="30" rx="3" fill="#E3E9EB" stroke="#C7D2D6"/>
      <text x="322" y="148">train</text>
      <rect x="432" y="128" width="80" height="30" rx="3" fill="#0B6E75"/>
      <text x="472" y="148" fill="#FFFFFF" font-weight="600">test</text>

      <!-- step 4 -->
      <text x="34" y="192" fill="#8A979D">4</text>
      <rect x="292" y="172" width="220" height="30" rx="3" fill="#E3E9EB" stroke="#C7D2D6"/>
      <text x="402" y="192">train</text>
      <rect x="512" y="172" width="80" height="30" rx="3" fill="#0B6E75"/>
      <text x="552" y="192" fill="#FFFFFF" font-weight="600">test</text>
    </g>

    <!-- time axis -->
    <path d="M 52,222 L 620,222 M 613,218 L 620,222 L 613,226" fill="none" stroke="#8A979D" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="620" y="214" font-size="12.5" font-style="italic" fill="#8A979D" text-anchor="end">time</text>

    <!-- concatenated OOS series -->
    <rect x="272" y="244" width="320" height="30" rx="3" fill="#0B6E75"/>
    <g stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="3 3">
      <line x1="352" y1="246" x2="352" y2="272"/>
      <line x1="432" y1="246" x2="432" y2="272"/>
      <line x1="512" y1="246" x2="512" y2="272"/>
    </g>
    <text x="264" y="258" font-size="13" fill="#10171B" text-anchor="end">concatenate the test segments</text>
    <text x="264" y="274" font-size="13" fill="#10171B" text-anchor="end">into one OOS series  →</text>

    <text x="52" y="298" font-size="13" font-style="italic" fill="#58666E">Anchored (expanding train) or rolling (fixed-width train).</text>
  </g>
</svg>
